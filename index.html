<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0507">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Для тебя</title>
<link rel="preload" href="fonts/c865567969.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css?v=5">
<link rel="stylesheet" href="css/style.css?v=5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28S3 20 3 11a6.5 6.5 0 0 1 13-2 6.5 6.5 0 0 1 13 2c0 9-13 17-13 17z' fill='%23e8274b'/%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.2" fill="currentColor"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 18h6.5a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7H16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13.5v4M10 15.5h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</svg>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="fallback-scene" aria-hidden="true"><div class="fb-heart"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>
<div class="streak" aria-hidden="true"><i></i></div>

<button class="music" id="music" type="button" aria-pressed="false"><svg class="ic"><use href="#i-note"/></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></button>

<main id="app">
  <section class="screen s-intro is-active" data-screen="intro" aria-label="Начало">
    <h1 class="wide" data-t="introTitle" data-split></h1>
    <p class="serif-line" data-t="introLine"></p>
    <button class="hold" id="hold" aria-label="Подержи сердце"></button>
    <p class="hint" data-t="introHint"></p>
    <div class="hold-bar" aria-hidden="true"><i id="holdBar"></i></div>
  </section>

  <section class="screen s-frames" data-screen="frames" aria-label="Крым зимой" aria-roledescription="слайды">
    <div class="fr-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button class="link fr-skip" id="frSkip" type="button"></button>
    <div class="fr-stage" id="frStage">
      <figure class="frame" data-i="0">
        <svg class="art" viewBox="0 0 320 200" aria-hidden="true">
          <circle class="glow moon" cx="250" cy="44" r="16"/>
          <path class="ln" pathLength="1" d="M20 150H300"/>
          <path class="ln" pathLength="1" d="M70 150V78M92 150V70M114 150V74M136 150V82M190 150V96M212 150V104"/>
          <path class="ln" pathLength="1" d="M64 78H76M86 70H98M108 74H120M130 82H142M184 96H196M206 104H218M66 72Q103 52 140 76"/>
          <path class="ln thin" pathLength="1" d="M150 150L160 140H176L186 150M40 150L46 144H58"/>
          <g class="sea"><path d="M30 164H90M130 164H200M230 164H290"/><path d="M60 176H120M170 176H230"/><path d="M100 188H160M200 188H250"/></g>
        </svg>
      </figure>
      <figure class="frame" data-i="1">
        <svg class="art" viewBox="0 0 320 200" aria-hidden="true">
          <path class="ln" pathLength="1" d="M96 120V70M114 120V70M132 120V70M188 120V70M206 120V70M224 120V70"/>
          <path class="ln" pathLength="1" d="M86 70H234M90 64H230L160 34L90 64M150 120V84Q160 72 170 84V120"/>
          <path class="ln thin" pathLength="1" d="M70 120H250M60 128H260M50 136H270"/>
          <g class="lights"><circle cx="40" cy="60" r="1.6"/><circle cx="60" cy="54" r="1.6"/><circle cx="80" cy="50" r="1.6"/><circle cx="240" cy="50" r="1.6"/><circle cx="260" cy="54" r="1.6"/><circle cx="280" cy="60" r="1.6"/><circle cx="20" cy="140" r="1.4"/><circle cx="300" cy="140" r="1.4"/></g>
          <g class="boat"><path class="ln" pathLength="1" d="M0 0H34L28 8H6Z M8 0V-6H22V0"/><circle class="glow" cx="15" cy="-3" r="4"/></g>
          <g class="sea"><path d="M40 156H100M150 156H210M240 156H290"/><path d="M70 168H130M180 168H250"/><path d="M110 182H170"/></g>
        </svg>
      </figure>
      <figure class="frame" data-i="2">
        <svg class="art" viewBox="0 0 320 200" aria-hidden="true">
          <path class="ln" pathLength="1" d="M160 28L136 64H150L124 100H142L110 144H210L178 100H196L170 64H184Z"/>
          <path class="ln" pathLength="1" d="M154 144V160H166V144M30 160H290"/>
          <path class="ln thin" pathLength="1" d="M36 160V126L56 110L76 126V160M244 160V126L264 110L284 126V160M48 160V140H64V160M256 160V140H272V160"/>
          <g class="lights garland"><circle cx="150" cy="58" r="1.8"/><circle cx="172" cy="62" r="1.8"/><circle cx="140" cy="88" r="1.8"/><circle cx="160" cy="84" r="1.8"/><circle cx="182" cy="92" r="1.8"/><circle cx="128" cy="128" r="1.8"/><circle cx="150" cy="122" r="1.8"/><circle cx="172" cy="126" r="1.8"/><circle cx="196" cy="132" r="1.8"/></g>
          <path class="glow star" d="M160 18l3 7 7 .6-5.4 4.6 1.7 7L160 33.6 153.7 37.2l1.7-7L150 25.6l7-.6z"/>
        </svg>
      </figure>
      <figure class="frame" data-i="3">
        <svg class="art" viewBox="0 0 320 200" aria-hidden="true">
          <circle class="glow lamp2" cx="160" cy="62" r="34"/>
          <path class="ln" pathLength="1" d="M90 160V70Q90 26 160 26Q230 26 230 70V160M90 96H230M160 26V160"/>
          <path class="ln thin" pathLength="1" d="M160 10V44M150 44H170L166 52H154Z"/>
          <path class="ln" pathLength="1" d="M60 160H260M110 142H136V152Q123 158 110 152ZM184 142H210V152Q197 158 184 152ZM136 145Q142 145 140 150M210 145Q216 145 214 150"/>
          <g class="steam"><path d="M118 136Q114 128 120 122T118 108"/><path d="M128 136Q124 128 130 122T128 108"/><path d="M192 136Q188 128 194 122T192 108"/><path d="M202 136Q198 128 204 122T202 108"/></g>
        </svg>
      </figure>
    </div>
    <div class="fr-cap" aria-live="polite"><h2 class="wide" id="frTitle"></h2><p class="serif-line" id="frText"></p></div>
    <div class="fr-nav"><p class="hint" id="frTap"></p><button class="btn btn-primary" id="frNext" type="button"><span></span><svg class="ic"><use href="#i-arrow"/></svg></button></div>
  </section>

  <section class="screen s-ask" data-screen="ask" aria-label="Вопрос">
    <div class="ask-text">
      <svg class="emblem" viewBox="0 0 320 150" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="beamG" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ffd7a6" stop-opacity=".55"/><stop offset=".55" stop-color="#ffb48f" stop-opacity=".14"/><stop offset="1" stop-color="#ffb48f" stop-opacity="0"/></linearGradient>
          <radialGradient id="lampG"><stop offset="0" stop-color="#fff3e2"/><stop offset=".35" stop-color="#ffd7a6" stop-opacity=".8"/><stop offset="1" stop-color="#ffb48f" stop-opacity="0"/></radialGradient>
        </defs>
        <g class="beam"><polygon points="214,47 66,26 66,70 214,49" fill="url(#beamG)"/></g>
        <circle class="lamp" cx="214" cy="48" r="11" fill="url(#lampG)"/>
        <path class="ln" pathLength="1" d="M0 118H38C58 117 70 112 88 110C104 108 112 100 128 99L150 98C160 97 168 92 178 90L198 86H232C240 86 246 92 252 100C258 108 266 116 286 118H320"/>
        <path class="ln thin" pathLength="1" d="M124 99V88M121.5 88H126.5M130 98.5V86M127.5 86H132.5M136 98.3V89M133.5 89H138.5"/>
        <path class="ln" pathLength="1" d="M208 86L211 52H217L220 86M206 52H222M209 52V44H219V52M207 44L214 37.5L221 44"/>
        <g class="sea"><path d="M60 127H96M150 127H196M232 127H262"/><path d="M96 134H128M176 134H204M248 134H286"/><path d="M128 141H150M196 141H224"/></g>
        <path class="refl" d="M214 122V126M214 130V133M214 137V139M214 143V144"/>
      </svg>
      <h2 class="display" data-t="question" data-split></h2>
      <p class="sub" data-t="questionSub"></p>
      <div class="ask-btns">
        <button class="btn btn-primary" id="yes"><span data-t="yes"></span></button>
        <button class="btn btn-quiet btn-no" id="no" data-t="no"></button>
      </div>
      <p class="taunt" id="taunt" aria-live="polite"></p>
      <a class="link" id="chatAsk" target="_blank" rel="noopener"><svg class="ic"><use href="#i-chat"/></svg><span data-t="chatLink"></span></a>
    </div>
  </section>

  <section class="screen s-later" data-screen="later" aria-label="Ответ">
    <svg class="emblem" viewBox="0 0 320 150" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="beamG2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ffd7a6" stop-opacity=".55"/><stop offset=".55" stop-color="#ffb48f" stop-opacity=".14"/><stop offset="1" stop-color="#ffb48f" stop-opacity="0"/></linearGradient>
          <radialGradient id="lampG2"><stop offset="0" stop-color="#fff3e2"/><stop offset=".35" stop-color="#ffd7a6" stop-opacity=".8"/><stop offset="1" stop-color="#ffb48f" stop-opacity="0"/></radialGradient>
        </defs>
        <g class="beam"><polygon points="214,47 66,26 66,70 214,49" fill="url(#beamG2)"/></g>
        <circle class="lamp" cx="214" cy="48" r="11" fill="url(#lampG2)"/>
        <path class="ln" pathLength="1" d="M0 118H38C58 117 70 112 88 110C104 108 112 100 128 99L150 98C160 97 168 92 178 90L198 86H232C240 86 246 92 252 100C258 108 266 116 286 118H320"/>
        <path class="ln thin" pathLength="1" d="M124 99V88M121.5 88H126.5M130 98.5V86M127.5 86H132.5M136 98.3V89M133.5 89H138.5"/>
        <path class="ln" pathLength="1" d="M208 86L211 52H217L220 86M206 52H222M209 52V44H219V52M207 44L214 37.5L221 44"/>
        <g class="sea"><path d="M60 127H96M150 127H196M232 127H262"/><path d="M96 134H128M176 134H204M248 134H286"/><path d="M128 141H150M196 141H224"/></g>
        <path class="refl" d="M214 122V126M214 130V133M214 137V139M214 143V144"/>
      </svg>
    <h2 class="display" data-t="laterTitle" data-split></h2>
    <p class="lead" data-t="laterLine"></p>
    <div class="stack">
      <button class="btn btn-primary" id="laterCoffee" data-t="laterBack"></button>
      <a class="btn btn-quiet" id="laterSend" target="_blank" rel="noopener"><span data-t="laterSend"></span></a>
    </div>
  </section>

  <section class="screen s-yes" data-screen="yes" aria-label="Ура">
    <h2 class="wide xl" data-t="afterYes" data-split></h2>
    <p class="lead" data-t="afterYesSub"></p>
    <button class="btn btn-primary" data-go="mood"><span data-t="afterYesGo"></span><svg class="ic"><use href="#i-arrow"/></svg></button>
  </section>

  <section class="screen s-mood scroll" data-screen="mood" aria-label="Настроение">
    <div class="head"><h2 class="wide" data-t="moodTitle" data-split></h2><p class="sub" data-t="moodSub"></p></div>
    <div class="moods" id="moods" role="group" aria-label="Настроение"></div>
    <div class="parts" id="parts" role="radiogroup" aria-label="Время суток"></div>
    <div class="nav"><button class="btn btn-icon" data-back aria-label="Назад"><svg class="ic"><use href="#i-back"/></svg></button><button class="btn btn-primary grow" id="moodNext">Дальше<svg class="ic"><use href="#i-arrow"/></svg></button></div>
  </section>

  <section class="screen s-city scroll" data-screen="city" aria-label="Город">
    <div class="head"><h2 class="wide" data-t="cityTitle" data-split></h2><p class="sub" data-t="citySub"></p></div>
    <ol class="cities" id="cities"></ol>
    <div class="nav"><button class="btn btn-icon" data-back aria-label="Назад"><svg class="ic"><use href="#i-back"/></svg></button><button class="btn btn-primary grow" id="cityNext" disabled>Дальше<svg class="ic"><use href="#i-arrow"/></svg></button></div>
  </section>

  <section class="screen s-date scroll" data-screen="date" aria-label="Дата">
    <div class="head"><h2 class="wide" data-t="dateTitle" data-split></h2><p class="sub" data-t="dateSub"></p></div>
    <div class="cal" id="cal"></div>
    <p class="note" id="dateNote" aria-live="polite"></p>
    <p class="wx-line" id="dateWx" aria-live="polite"></p>
    <div class="times" id="times" role="group" aria-label="Время"></div>
    <a class="link" id="chatDate" target="_blank" rel="noopener"><svg class="ic"><use href="#i-chat"/></svg><span data-t="dateChat"></span></a>
    <div class="nav"><button class="btn btn-icon" data-back aria-label="Назад"><svg class="ic"><use href="#i-back"/></svg></button><button class="btn btn-primary grow" id="dateNext" disabled>Дальше<svg class="ic"><use href="#i-arrow"/></svg></button></div>
  </section>

  <section class="screen s-act scroll" data-screen="act" aria-label="Чем займёмся">
    <div class="head"><h2 class="wide" data-t="actTitle" data-split></h2><p class="sub"><span id="actCity"></span> · <span data-t="actSub"></span></p></div>
    <div class="acts" id="acts"></div>
    <div class="nav sticky"><button class="btn btn-icon" data-back aria-label="Назад"><svg class="ic"><use href="#i-back"/></svg></button><button class="btn btn-primary grow" id="actNext" disabled>Дальше<svg class="ic"><use href="#i-arrow"/></svg></button></div>
  </section>

  <section class="screen s-wish scroll" data-screen="wish" aria-label="Пожелание">
    <div class="head"><h2 class="wide" data-t="wishTitle" data-split></h2><p class="sub" data-t="wishSub"></p></div>
    <label class="sr" for="wish">Твоё пожелание</label>
    <textarea id="wish" rows="5" maxlength="600"></textarea>
    <div class="chips" id="chips"></div>
    <div class="nav"><button class="btn btn-icon" data-back aria-label="Назад"><svg class="ic"><use href="#i-back"/></svg></button><button class="btn btn-primary grow" id="wishNext">Готово</button></div>
  </section>

  <section class="screen s-final scroll" data-screen="final" aria-label="Итог">
    <h2 class="wide final-title" data-t="finalTitle" data-split></h2>
    <p class="sub" data-t="finalSub"></p>
    <div class="countdown" id="cd"></div>
    <article class="ticket" id="ticket"></article>
    <div class="details" id="details"><section class="card map-card" id="mapCard"></section><section class="card wx-card" id="wxCard"></section></div>
    <div class="stack send">
      <a class="btn btn-primary" id="sendTg" target="_blank" rel="noopener"><svg class="ic"><use href="#i-send"/></svg><span></span></a>
      <a class="btn btn-quiet" id="sendVk" target="_blank" rel="noopener" hidden></a>
      <div class="row2">
        <button class="btn btn-quiet" id="copy"><svg class="ic"><use href="#i-copy"/></svg><span></span></button>
        <button class="btn btn-quiet" id="share" hidden></button>
      </div>
      <p class="toast" id="toast" aria-live="polite"></p>
    </div>
    <div class="daisy-wrap"><p class="sub" data-t="daisyHint"></p><div class="daisy" id="daisy"></div><p class="daisy-say" id="daisySay" aria-live="polite"></p></div>
    <button class="link" id="edit"></button>
  </section>
</main>

<script src="config.js?v=5"></script>
<script src="js/gsap.min.js?v=5"></script>
<script src="js/gl.js?v=5"></script>
<script src="js/day.js?v=5"></script>
<script src="js/music.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
